[package]
name = "rsbdd"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "A BDD-based SAT solver"

[workspace]
members = [
  ".",
  "maxclique2rsbdd",
  "nqueens2rsbdd",
  "random_graph_gen",
  "sudoku2rsbdd",
  "tptp2rsbdd",
]
default-members = ["."]

[workspace.package]
version = "0.28.0"
authors = ["Tim Beurskens <timbeurskens.97@gmail.com>"]
edition = "2024"

[workspace.dependencies]
antlr-rust-codegen = "0.34.0"
antlr-rust-runtime = "0.34.0"
anyhow = "1.0.103"
argfile = "1.0.0"
clap = { version = "4.6.2", features = ["derive", "env", "usage", "wrap_help"] }
csv = "1.4.0"
dot = "0.2.0"
flate2 = "1.1.10"
glob = "0.3.3"
insta = "1.49.0"
itertools = "0.15.0"
lazy_static = "1.5.0"
pretty_assertions = "1.4.1"
rand = "0.10.3"
regex = "1.13.1"
rustc-hash = "2.1.3"
tar = "0.4.46"
ureq = "3.5.0"
wild = "2.2.1"

[workspace.lints.clippy]
enum_glob_use = "deny"
future_not_send = "allow"
# pedantic = "deny"
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow.workspace = true
argfile.workspace = true
clap.workspace = true
dot.workspace = true
hashbrown = { version = "0.17.1", default-features = false }
itertools.workspace = true
lazy_static.workspace = true
regex.workspace = true
rustc-hash.workspace = true
wild.workspace = true

[dev-dependencies]
glob.workspace = true
insta = { workspace = true, features = ["glob"] }
pretty_assertions.workspace = true

[lints]
workspace = true
