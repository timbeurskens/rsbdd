[workspace]
members = [".", "n_queens_gen", "max_clique_gen", "random_graph_gen", "sudoku_gen", "multiplier_gen"]
default-members = ["."]

[workspace.package]
edition = "2021"
authors = ["Tim Beurskens <timbeurskens.97@gmail.com>"]

[package]
name = "rsbdd"
description = "A BDD-based SAT solver"
version = "0.14.5"
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
dot.workspace = true
itertools.workspace = true
lazy_static.workspace = true
rand.workspace = true
rustc-hash.workspace = true
clap.workspace = true
csv.workspace = true
regex.workspace = true
rayon.workspace = true
argfile.workspace = true
wild.workspace = true
anyhow.workspace = true

[dev-dependencies]
glob.workspace = true
pretty_assertions.workspace = true

[workspace.dependencies]
dot = "0.1"
itertools = "0.13.0"
lazy_static = "1.5.0"
rand = "0.8"
rustc-hash = "2.0.0"
clap = { version = "4.5.17", features = ["derive", "env", "wrap_help", "usage"] }
csv = "1.3"
regex = "1.10.6"
glob = "0.3"
pretty_assertions = "1.4"
anyhow = "1.0.87"
rayon = "1.10.0"
argfile = "0.2.1"
wild = "2.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
enum_glob_use = "deny"
#pedantic = "deny"
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
future_not_send = "allow"