[package]
name = "rsbdd"
version = "0.15.1"
authors.workspace = true
edition.workspace = true
description = "A BDD-based SAT solver"

[workspace]
members = [
  ".",
  "max_clique_gen",
  "n_queens_gen",
  "random_graph_gen",
  "sudoku_gen"
]
default-members = ["."]

[workspace.package]
authors = ["Tim Beurskens <timbeurskens.97@gmail.com>"]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.103"
argfile = "1.0.0"
clap = { version = "4.6.2", features = ["derive", "env", "usage", "wrap_help"] }
csv = "1.4.0"
dot = "0.1.4"
glob = "0.3.3"
itertools = "0.15.0"
lazy_static = "1.5.0"
pretty_assertions = "1.4.1"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
wild = "2.2.1"

[workspace.lints.clippy]
enum_glob_use = "deny"
future_not_send = "allow"
# pedantic = "deny"
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow.workspace = true
argfile.workspace = true
clap.workspace = true
csv.workspace = true
dot.workspace = true
itertools.workspace = true
lazy_static.workspace = true
rand.workspace = true
rayon.workspace = true
regex.workspace = true
rustc-hash.workspace = true
wild.workspace = true

[dev-dependencies]
glob.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
